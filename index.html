<!doctype html>
<!-- TOPIC 01: HTML INTRODUCTION AND DOCUMENT STRUCTURE
 THEORY:
 HTML (HyperText Markup Language) describes the structure/content of a webpage.
 Elements are usually written with an opening tag, content, and a closing tag.
 The doctype tells the browser to use modern HTML standards mode.
 The head contains page metadata; the body contains visible page content. -->
<html lang="en">

<head>
    <meta charset="UTF-8"> <!-- Supports a wide range of characters. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Mobile scaling. -->
    <title>My First Webpage</title>
</head>

<body>
    <!-- EXAMPLE 1: A simple heading and paragraph -->
    <h1>Hello, Web World!</h1>
    <p>This is my first HTML page.</p>
    <p>HTML is fun to learn!</p>
    <p>HTML is the foundation of web development.</p>

    <!-- EXAMPLE 2: Inline emphasis -->
    <p>I am learning <strong>HTML</strong> and <em>CSS</em>.</p>

    <!-- EXAMPLE 3: A small content section -->
    <section>
        <h2>My Goal</h2>
        <p>I will build accessible, responsive websites step by step.</p>
    </section>
</body>

</html>
